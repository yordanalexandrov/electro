<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Електро 3D — трасета на ел. инсталация</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">⚡ Електро 3D <span class="tag">POC</span></div>
        <div class="seg" id="viewSeg">
          <button data-view="plan" title="Изглед отгоре (Tab)">План</button>
          <button data-view="3d" class="on" title="3D изглед (Tab)">3D</button>
        </div>
        <div class="spacer"></div>
        <button id="btnUndo" title="Отмени (Ctrl+Z)">↶</button>
        <button id="btnFrame" title="Центрирай">⌖</button>
        <label class="chk"><input type="checkbox" id="chkGrid" checked /> Мрежа</label>
        <label class="chk"><input type="checkbox" id="chkCeiling" /> Таван</label>
        <div class="menu">
          <button id="btnMore" title="Още">⋯</button>
          <div class="menu-list" id="menuList">
            <button id="btnMenuGrid" class="only-mobile">Мрежа вкл/изкл</button>
            <button id="btnMenuCeiling" class="only-mobile">Таван вкл/изкл</button>
            <button id="btnExport">Експорт JSON</button>
            <button id="btnImport">Импорт JSON</button>
            <button id="btnImportSh3d">Импорт Sweet Home 3D (.sh3d)</button>
            <button id="btnSample">Зареди примера</button>
            <button id="btnClear" class="danger">Изчисти всичко</button>
            <input type="file" id="fileImport" accept="application/json" hidden />
            <input type="file" id="fileSh3d" accept=".sh3d,application/zip" hidden />
          </div>
        </div>
        <button id="btnSide" class="only-mobile" title="Свойства">☰</button>
      </header>

      <aside class="rail" id="rail">
        <button data-tool="select" class="on" title="Избор (1)"><span class="ico">⬚</span><span class="lbl">Избор</span></button>
        <button data-tool="wall" title="Стена (2)"><span class="ico">▬</span><span class="lbl">Стена</span></button>
        <button data-tool="panel" title="Табло (3)"><span class="ico">▣</span><span class="lbl">Табло</span></button>
        <button data-tool="outlet" title="Контакт (4)"><span class="ico">⏚</span><span class="lbl">Контакт</span></button>
        <button data-tool="switch" title="Ключ (5)"><span class="ico">⏻</span><span class="lbl">Ключ</span></button>
        <button data-tool="box" title="Разклонителна кутия (6)"><span class="ico">◈</span><span class="lbl">Кутия</span></button>
        <button data-tool="lamp" title="Лампа (7)"><span class="ico">✺</span><span class="lbl">Лампа</span></button>
        <button data-tool="cable" title="Кабел (8)"><span class="ico">〰</span><span class="lbl">Кабел</span></button>
      </aside>

      <main class="stage" id="stage">
        <canvas id="c"></canvas>
        <div class="draft-bar" id="draftBar" hidden>
          <span id="draftText"></span>
          <button id="btnDraftDone" class="primary">Готово</button>
          <button id="btnDraftCancel">Откажи</button>
        </div>
      </main>

      <aside class="side" id="side">
        <section id="props"></section>
        <section id="summary"></section>
      </aside>

      <footer class="status" id="status"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
